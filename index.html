<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="description" content="Survivor-like de reações elementais: sobreviva à horda e desperte a floresta." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <title>Guardião da Floresta: Despertar</title>
  <style>
    @font-face {
      font-family: 'Jersey 15';
      src: url('./assets/fonts/Jersey15.woff2') format('woff2');
      font-display: block;
    }
    @font-face {
      font-family: 'Atkinson Hyperlegible';
      font-weight: 700;
      src: url('./assets/fonts/AtkinsonHyperlegible-Bold.woff2') format('woff2');
      font-display: block;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0e0a; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    body { display: grid; place-items: center; font-family: 'Jersey 15', monospace; color: #e8f0e6; }
    /* Área útil dinâmica: o jogo ocupa só o que está visível e fora de notch/ilha/
       indicador de início (safe-area). --vvh vem do visualViewport (JS abaixo), que
       acompanha as barras do Safari aparecendo/sumindo; 100dvh é a reserva. */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      height: calc(var(--vvh, 100dvh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    }
    #game canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

    #rotate-overlay {
      position: fixed; inset: 0; display: none; place-items: center;
      background: #0a0e0a; z-index: 9999; padding: 20px; text-align: center;
    }
    #rotate-overlay .icon { font-size: 64px; margin-bottom: 24px; animation: rot 2s ease-in-out infinite; }
    #rotate-overlay p { font-size: 20px; font-weight: 700; line-height: 1.8; max-width: 320px; }
    @keyframes rot { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-overlay { display: grid; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-overlay">
    <div>
      <div class="icon">⟳</div>
      <p>Gire o dispositivo para o modo paisagem</p>
    </div>
  </div>

  <script src="./vendor/phaser.min.js"></script>
  <script src="./vendor/nipplejs.min.js"></script>
  <script type="module" src="./src/main.js"></script>
  <script>
    // Mantém --vvh = altura realmente visível e avisa o Phaser (que só ouve window.resize)
    (function () {
      const vv = window.visualViewport;
      if (!vv) return;
      let last = 0;
      const sync = () => {
        document.documentElement.style.setProperty("--vvh", vv.height + "px");
        if (Math.abs(vv.height - last) > 0.5) {
          last = vv.height;
          window.dispatchEvent(new Event("resize"));
        }
      };
      vv.addEventListener("resize", sync);
      sync();
    })();
  </script>
  <script>
    // PWA offline (só na web; no app nativo os arquivos já estão no pacote)
    if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !window.Capacitor) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
