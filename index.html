<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="description" content="Survivor-like de reações elementais: sobreviva à horda e desperte a floresta." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <title>Guardião da Floresta: Despertar</title>
  <style>
    @font-face {
      font-family: 'Jersey 15';
      src: url('./assets/fonts/Jersey15.woff2') format('woff2');
      font-display: block;
    }
    @font-face {
      font-family: 'Atkinson Hyperlegible';
      font-weight: 700;
      src: url('./assets/fonts/AtkinsonHyperlegible-Bold.woff2') format('woff2');
      font-display: block;
    }
    /* Japonês e chinês: Fusion Pixel recortada (tools/font-subset.mjs); só baixa se usada */
    @font-face {
      font-family: 'Fusion Pixel JA';
      src: url('./assets/fonts/FusionPixel-ja.woff2') format('woff2');
      font-display: block;
    }
    @font-face {
      font-family: 'Fusion Pixel ZH';
      src: url('./assets/fonts/FusionPixel-zh.woff2') format('woff2');
      font-display: block;
    }
    @font-face {
      font-family: 'Fusion Pixel ZHT';
      src: url('./assets/fonts/FusionPixel-zht.woff2') format('woff2');
      font-display: block;
    }
    @font-face {
      font-family: 'Fusion Pixel Langs';
      src: url('./assets/fonts/FusionPixel-langs.woff2') format('woff2');
      font-display: block;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0e0a; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    body { display: grid; place-items: center; font-family: 'Jersey 15', monospace; color: #e8f0e6; }
    /* Área útil dinâmica: o jogo ocupa só o que está visível e fora de notch/ilha/
       indicador de início (safe-area). --vvh vem do visualViewport (JS abaixo), que
       acompanha as barras do Safari aparecendo/sumindo; 100dvh é a reserva. */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      height: calc(var(--vvh, 100dvh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    }
    /* No app Android o cenário vai até a borda, por baixo do furo da câmera (o Capacitor 8
       informa o recorte como safe-area e deixava uma faixa preta); a interface já fica
       longe das bordas. */
    html.native #game { top: 0; left: 0; right: 0; height: var(--vvh, 100dvh); }
    #game canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

    #rotate-overlay {
      position: fixed; inset: 0; display: none; place-items: center;
      background: #0a0e0a; z-index: 9999; padding: 20px; text-align: center;
    }
    #rotate-overlay .icon { font-size: 64px; margin-bottom: 24px; animation: rot 2s ease-in-out infinite; }
    html[lang="ja"] body { font-family: 'Fusion Pixel JA', 'Jersey 15', monospace; }
    html[lang="zh-CN"] body { font-family: 'Fusion Pixel ZH', 'Jersey 15', monospace; }
    html[lang="zh-TW"] body { font-family: 'Fusion Pixel ZHT', 'Jersey 15', monospace; }
    #rotate-overlay p { font-size: 20px; font-weight: 700; line-height: 1.8; max-width: 320px; }
    @keyframes rot { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-overlay { display: grid; }
    }
  </style>
  <script>
    // a ponte do Capacitor é injetada antes da página: marca o app nativo já no primeiro desenho
    if (window.Capacitor?.isNativePlatform?.()) document.documentElement.classList.add("native");
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-overlay">
    <div>
      <div class="icon">⟳</div>
      <p id="rotate-text">Gire o dispositivo para o modo paisagem</p>
    </div>
  </div>

  <script>
    // Idioma da página antes do jogo carregar (mesma regra de src/i18n/i18n.js)
    (function () {
      var ids = ["pt", "en", "es", "ja", "zh", "zht"], lang = null, s = {};
      var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
      try { s = JSON.parse(localStorage.getItem("guardiao_settings_v1") || "{}"); } catch (e) {}
      lang = s.lang;
      // a escolha no jogo perde para uma troca de idioma do aparelho feita depois dela
      if (s.langDevice != null && s.langDevice !== String(list[0] || "")) lang = null;
      var of = function (tag) {
        var t = String(tag || "").toLowerCase(), base = t.split(/[-_]/)[0];
        if (base === "zh") return !/hans/.test(t) && /hant|[-_](tw|hk|mo)(?![a-z])/.test(t) ? "zht" : "zh";
        return base;
      };
      if (ids.indexOf(lang) < 0) {
        for (var i = 0; i < list.length && ids.indexOf(lang) < 0; i++) lang = of(list[i]);
        if (ids.indexOf(lang) < 0) lang = "en";
      }
      var rot = {
        en: "Rotate your device to landscape mode",
        es: "Gira el dispositivo a modo horizontal",
        ja: "端末を横向きにしてください",
        zh: "请将设备横屏",
        zht: "請將裝置轉為橫向",
      };
      document.documentElement.lang = { pt: "pt-BR", en: "en", es: "es", ja: "ja", zh: "zh-CN", zht: "zh-TW" }[lang];
      if (rot[lang]) document.getElementById("rotate-text").textContent = rot[lang];
      var title = { en: "Forest Guardian", es: "Guardián del Bosque", ja: "森の守護者", zh: "森林守护者", zht: "森林守護者" };
      if (title[lang]) document.title = title[lang];
    })();
  </script>
  <script src="./vendor/phaser.min.js"></script>
  <script src="./vendor/nipplejs.min.js"></script>
  <script type="module" src="./src/main.js"></script>
  <script>
    // Mantém --vvh = altura realmente visível e avisa o Phaser (que só ouve window.resize)
    (function () {
      const vv = window.visualViewport;
      if (!vv) return;
      let last = 0;
      const sync = () => {
        document.documentElement.style.setProperty("--vvh", vv.height + "px");
        if (Math.abs(vv.height - last) > 0.5) {
          last = vv.height;
          window.dispatchEvent(new Event("resize"));
        }
      };
      vv.addEventListener("resize", sync);
      sync();
    })();
  </script>
  <script>
    // PWA offline (só na web; no app nativo os arquivos já estão no pacote)
    if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !window.Capacitor) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
